name: UDP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe UDP 443 (QUIC version negotiation)
        run: |
          python3 - <<'PY'
          import os, socket, struct

          TARGETS = [
              ("124.174.93.145", 443),
              ("8.8.8.8", 443),
              ("1.1.1.1", 443),
          ]

          dcid, scid = os.urandom(8), os.urandom(8)
          packet = (
              b"\xc0"
              + struct.pack("!I", 0x1A2A3A4A)
              + bytes([len(dcid)]) + dcid
              + bytes([len(scid)]) + scid
              + b"\x00" * 40
          )

          for host, port in TARGETS:
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.settimeout(5.0)
              try:
                  s.sendto(packet, (host, port))
                  try:
                      data, _ = s.recvfrom(2048)
                      if len(data) >= 5 and data[1:5] == b"\x00\x00\x00\x00":
                          versions = struct.unpack("!%dI" % ((len(data) - 5) // 4), data[5:])
                          print(f"{host}:{port} -> QUIC 服务在线, 版本: {[hex(v) for v in versions]}")
                      else:
                          print(f"{host}:{port} -> 收到 {len(data)} 字节非 VN 响应")
                  except socket.timeout:
                      print(f"{host}:{port} -> 超时无响应")
              finally:
                  s.close()
          PY
      - name: Context checks
        run: |
          nc -zvu -w 5 124.174.93.145 443 2>&1 || true
          nc -z -w 5 124.174.93.145 443 && echo 'tcp443: open' || echo 'tcp443: closed'
