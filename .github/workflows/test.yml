name: Test package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Download and execute testfile
        shell: bash
        run: |
          set +e
          timeout 10s helloworld
          status=$?
          set -e
          if [[ "$status" == "0" ]]; then
            echo "testfile completed successfully"
          elif [[ "$status" == "124" ]]; then
            echo "testfile started successfully and remained running for 10 seconds"
          else
            echo "testfile failed with exit code $status" >&2
            exit "$status"
          fi
